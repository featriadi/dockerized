version: "3.9"

services:
  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION}
    container_name: phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}

    ports:
      - "${PHPMYADMIN_PORT}:80"

    networks: 
      - mysql_default

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:80/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks: 
  mysql_default: 
    external: true