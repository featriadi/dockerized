version: "3.9"

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "${GRAFANA_PORT}:3000"

    volumes:
      - data:/var/lib/grafana

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:3000/api/health | grep -q '\"database\": \"ok\"' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
