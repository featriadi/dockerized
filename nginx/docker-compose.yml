version: "3.9"

services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    restart: unless-stopped

    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./conf.d:/etc/nginx/conf.d
      - data:/var/log/nginx

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
