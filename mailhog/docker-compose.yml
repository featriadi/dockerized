version: "3.9"

services:
  mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION}
    container_name: mailhog
    restart: unless-stopped

    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8025 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
