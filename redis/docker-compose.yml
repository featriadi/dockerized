version: "3.9"

services:
  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD}

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $$REDIS_PASSWORD ping || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
